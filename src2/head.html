<title>Stopover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --page: #EDF0EA; --panel: #FFFFFF; --panel-2: #F4F6F2; --ink: #16221D; --muted: #5C6A63; --line: #D3DAD2;
  --sign: #0B6B3A; --sign-ink: #FFFFFF; --sign-edge: #E9F3EC; --fuel: #E9A21B; --danger: #C42B2B; --good: #1B8A4C;
  --ferry: #1D6FB8; --focus: #1D6FB8; --route: #D7263D; --accent: #0B6B3A; --accent-ink: #FFFFFF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0C1411; --panel: #131D19; --panel-2: #18241F; --ink: #E5EDE8; --muted: #93A39A; --line: #26352F;
    --sign: #0E7B44; --sign-ink: #FFFFFF; --sign-edge: #1B3A2A; --fuel: #F2B233; --danger: #FF6B6B; --good: #4CC47E; --ferry: #5AAAE8; --focus: #5AAAE8; --accent: #0E7B44;
  }
}
:root[data-theme="dark"] {
  --page: #0C1411; --panel: #131D19; --panel-2: #18241F; --ink: #E5EDE8; --muted: #93A39A; --line: #26352F;
  --sign: #0E7B44; --sign-ink: #FFFFFF; --sign-edge: #1B3A2A; --fuel: #F2B233; --danger: #FF6B6B; --good: #4CC47E; --ferry: #5AAAE8; --focus: #5AAAE8; --accent: #0E7B44;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.45 var(--body); padding-inline: 16px; padding-block: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }
.app { max-width: 1440px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: auto 1fr; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; flex-wrap: wrap; }
/* everything in the bar sits on one line at one height, so nothing shouts louder than the colour it is painted */
.bar nav .btn, .bar .status, .bar .menuwrap { height: 32px; }
.bar nav .btn { display: inline-flex; align-items: center; justify-content: center; padding-block: 0; }
.bar .status .leaguechip, .bar .status .coins { padding-block: 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.shield { background: var(--fuel); color: #1d1606; font: 800 15px/1 var(--display); padding: 5px 7px 4px; border-radius: 4px 4px 10px 10px; }
.wordmark { font: 800 30px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.ver { font: 700 12px/1 var(--display); letter-spacing: .1em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px 2px; }
.bar nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
/* the ticker: one quiet line beside the logo, gliding through and gone */
.brand { min-width: 0; flex: 1 1 auto; }
.ticker { position: relative; flex: 1 1 auto; min-width: 0; max-width: 380px; height: 26px; overflow: hidden; margin-left: 6px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
.tk { position: absolute; left: 0; top: 0; line-height: 26px; white-space: nowrap; font: 500 14px/26px var(--body); color: var(--muted); will-change: transform; }
.tk.still { left: 10px; }
.tk b { color: var(--ink); font-weight: 700; }
.tk small { font-size: 12px; opacity: .8; }
.tk .fl { height: .95em; }
.tk-boost { margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--fuel) 26%, transparent); color: var(--ink); font-weight: 600; font-size: 12.5px; }
@media (max-width: 760px) { .ticker { display: none !important; } }
.btn.icon { padding: 7px 10px; font: 700 15px/1.15 var(--display); min-width: 34px; text-align: center; }
.menuwrap { position: relative; display: inline-flex; }
.btn.menubtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; font-size: 15px; }
.btn.menubtn kbd { pointer-events: none; background: var(--panel-2); }
.btn.menubtn[aria-expanded="true"] { border-color: var(--ink); background: var(--panel-2); }
.quickmenu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 252px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .55); display: grid; gap: 2px; }
.quickmenu button { display: grid; grid-template-columns: 20px 1fr auto auto; align-items: center; gap: 9px; width: 100%; border: 0; background: none; border-radius: 8px; padding: 8px 9px; cursor: pointer; font: 600 14px/1.1 var(--body); text-align: left; color: var(--ink); }
.quickmenu button:hover, .quickmenu button:focus-visible { background: var(--panel-2); }
.quickmenu button .count { margin-left: 0; }
.quickmenu button kbd { min-width: 22px; text-align: center; }
.quickmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.quickmenu .foot { color: var(--muted); font-size: 12px; padding: 3px 9px 5px; }
.status { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); overflow: hidden; }
.status .leaguechip, .status .coins { border: 0; border-radius: 0; background: none; }
.status .coins { border-left: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.status .leaguechip:hover, .status .coins:hover { background: var(--panel-2); }
.coins { display: inline-flex; align-items: center; gap: 6px; font: 700 18px/1 var(--display); padding: 6px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.coins i, .price i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE08A, #D99A12 70%); box-shadow: inset 0 0 0 1.5px rgba(120, 70, 0, .45); display: inline-block; }
.price i { width: 12px; height: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn.cta { background: #F2622A; color: #fff; border-color: #F2622A; font: 700 15px/1 var(--display); letter-spacing: .02em; padding: 7px 14px; }
.btn.cta:hover:not(:disabled) { border-color: #C94A18; background: #E4541C; }
.bookpage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; padding: 12px; border-radius: 8px; background: #F6F1E3; background-image: repeating-linear-gradient(0deg, transparent 0 23px, rgba(90,120,140,.08) 23px 24px); min-height: 220px; }
.bookpage .stamp svg { width: 100%; height: auto; display: block; }
.bookpage p { grid-column: 1 / -1; }
.leaguerow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.leaguerow div { display: grid; gap: 4px; justify-items: center; text-align: center; font-size: 11.5px; color: var(--muted); opacity: .7; }
.leaguerow div.current { opacity: 1; color: var(--ink); font-weight: 600; }
.leaguerow svg { width: 100%; height: auto; }
.leaguechip { display: inline-flex; align-items: center; gap: 6px; font: 700 14px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.leaguechip i { width: 11px; height: 15px; border-radius: 2px; display: inline-block; }
.modes .free { font: 700 10px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--good); color: #fff; border-radius: 999px; padding: 2px 5px; margin-left: 3px; vertical-align: 1px; }
dialog.news { width: min(560px, calc(100vw - 32px)); overflow: hidden; }
.news-hero { position: relative; height: 260px; overflow: hidden; background: linear-gradient(180deg, #2A76C6 0%, #7BB8E8 55%, #F6D7A7 100%); }
.news-hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.news-hero .cloud { animation: drift 18s linear infinite; }
.news-hero .cloud.b { animation-duration: 26s; animation-delay: -9s; }
.news-hero .plane { animation: takeoff 6.5s cubic-bezier(.45,0,.7,1) infinite; }
.news-hero .blur { animation: speedlines 6.5s linear infinite; }
@keyframes drift { from { transform: translateX(620px); } to { transform: translateX(-260px); } }
@keyframes takeoff { 0% { transform: translate(-40px, 0) rotate(0deg); } 45% { transform: translate(250px, 0) rotate(0deg); } 60% { transform: translate(360px, -18px) rotate(-9deg); } 100% { transform: translate(760px, -210px) rotate(-14deg); } }
@keyframes speedlines { 0%, 20% { opacity: 0; } 40%, 58% { opacity: .8; } 70%, 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .news-hero .plane { animation: none; transform: translate(300px, -110px) rotate(-12deg); } .news-hero .cloud, .news-hero .blur { animation: none; } }
.news-body { padding: 18px 22px 20px; display: grid; gap: 10px; }
.news-body .eyebrow { font: 700 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: #F2622A; }
.news-body h2 { margin: 0; font: 800 38px/0.95 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.news-body p { margin: 0; color: var(--muted); max-width: 52ch; }
.news-perk { display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--good) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); border-radius: 10px; padding: 10px 12px; }
.news-perk b { font: 800 30px/1 var(--display); color: var(--good); }
.entryfoot { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.entryfoot .msg { flex: 1; min-width: 0; }
.toolbox { position: relative; flex: none; display: flex; gap: 6px; align-items: start; }
.toolsmenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.45); padding: 6px; display: grid; gap: 2px; }
.toolsmenu > .hint { padding: 6px 8px 4px; }
.toolsmenu button { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; }
.toolsmenu button:hover:not(:disabled) { background: var(--panel-2); }
.toolsmenu button:disabled { opacity: .45; cursor: not-allowed; }
.toolsmenu .cost { font: 500 12px/1 var(--mono); color: var(--muted); }
.toolsmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.toolsmenu .danger { color: var(--danger); }
.modes button { padding: 3px 10px; }
.covergrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.covertile { border: 2px solid transparent; background: transparent; border-radius: 8px; padding: 3px; cursor: pointer; display: grid; gap: 3px; font-size: 11.5px; text-align: center; color: var(--ink); }
.covertile svg { width: 100%; height: auto; }
.covertile.equipped { border-color: var(--sign); }
.covertile.locked { cursor: default; filter: grayscale(.85); opacity: .6; }
.mult { font: 700 16px/1 var(--display); padding: 5px 9px; border-radius: 6px; background: color-mix(in srgb, var(--fuel) 25%, transparent); letter-spacing: .03em; }
.rulerow { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: center; }
.rulerow .choices { margin-top: 0; }
.rulerow .choice { padding: 5px 9px; font-size: 13px; }
/* a continent is a split button: the name toggles the whole continent, the caret opens its areas */
.regrow { display: flex; flex-wrap: wrap; gap: 6px; }
.regsplit { display: inline-flex; align-items: stretch; }
.regsplit .choice { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.regsplit .choice small { display: block; }
.regcaret { border: 1px solid var(--line); border-left: 0; border-radius: 0 8px 8px 0; background: var(--panel-2); color: var(--muted); padding: 0 9px; cursor: pointer; font-size: 12px; line-height: 1; transition: transform .15s; }
.regcaret:hover:not(:disabled) { color: var(--ink); border-color: var(--ink); }
.regcaret[aria-expanded="true"] { color: var(--ink); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.regcaret[aria-expanded="true"] span { display: inline-block; transform: rotate(180deg); }
.regcaret:disabled { opacity: .45; cursor: not-allowed; }
.regsplit .choice[aria-pressed="true"] + .regcaret { border-color: var(--accent); }
.subpanel { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); display: grid; gap: 8px; }
.subhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.subhead .linkish { color: var(--ferry); font-size: 13px; font-weight: 600; }
.subhead .linkish + .linkish { margin-left: 10px; }
.subchips { display: flex; flex-wrap: wrap; gap: 6px; }
.subchips .choice { padding: 5px 10px; font-size: 13px; }
/* folds keep the long, rarely-touched parts of a dialog out of the way until they're wanted */
details.fold > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; padding: 4px 0; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "▾"; color: var(--muted); font-size: 12px; transition: transform .15s; }
details.fold[open] > summary::after { transform: rotate(180deg); }
details.fold > summary .label { flex: none; }
.foldnote { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 400; }
.foldsum { flex: 1; min-width: 0; text-align: right; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#fold-rules { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.foldbody { padding-top: 8px; }
.racesum { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.racesum li { display: grid; grid-template-columns: 84px 1fr; gap: 10px; align-items: baseline; background: var(--panel-2); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
.racesum li .label { font-size: 11px; }
/* a range rule: the track on top, what it means and what it pays underneath */
.rulerow .sliderrow { display: grid; gap: 5px; min-width: 0; }
.rulerow input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
.slidval { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--muted); }
.slidval b { font: 700 13px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .rulerow { grid-template-columns: 1fr; } }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button { border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-weight: 600; font-size: 13px; cursor: pointer; }
.modes button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.modes button:disabled { opacity: .45; cursor: not-allowed; }
.btn .cost { font: 500 11px/1 var(--mono); opacity: .7; margin-left: 4px; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 14px; padding-bottom: 16px; min-height: 0; }
.mapwrap { position: relative; border-radius: 12px; overflow: hidden; min-height: 540px; border: 1px solid var(--line); touch-action: none; background: #A8CBD5; }
.mapwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.mapwrap canvas.dragging { cursor: grabbing; }
.maptools { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.maptools button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; line-height: 1; }
.maplayers { position: absolute; right: 10px; top: 10px; z-index: 4; }
.layerpanel { position: absolute; right: 0; top: 40px; width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.45); display: grid; gap: 6px; font-size: 14px; }
.layerpanel label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: flex; gap: 12px; flex-wrap: wrap; max-width: calc(100% - 70px); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--route); vertical-align: middle; margin-right: 5px; }
.legend i.f { border-top: 3px dashed var(--ferry); }
.legend i.r { border-top: 2px dashed var(--ferry); }
.legend i.s { border-top: 3px dashed #12A150; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: #A8CBD5; color: #16221D; z-index: 3; padding: 20px; }
.loading b { display: block; font: 700 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }

.console { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
/* stop effects: points rising from the town, the stamp for a new country, the gauge brightening on a refill */
.ptfloat { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; font: 800 22px/1 var(--display); color: #fff; text-align: center;
  text-shadow: 0 1px 0 rgba(0,0,0,.45), 1px 0 0 rgba(0,0,0,.25), -1px 0 0 rgba(0,0,0,.25); will-change: transform, opacity; }
.ptfloat small { display: block; font: 700 12px/1.3 var(--display); letter-spacing: .04em; color: #FFE08A; }
.stampslam { position: absolute; left: 18px; bottom: 58px; z-index: 3; width: 170px; transform-origin: 30% 70%; pointer-events: none; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); background: #FFF8E6; border-radius: 12px; padding: 6px; }
.stampslam svg { display: block; width: 100%; height: auto; }
.gauge .fill.refilled { animation: refilled .5s ease-out; }
@keyframes refilled { from { opacity: .75; } to { opacity: 1; } }
.nudges { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.nudges ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.nudges li { display: flex; gap: 8px; align-items: baseline; }
.nudges li span { width: 18px; flex: none; text-align: center; }
.postnudge { font-size: 13px; background: color-mix(in srgb, var(--fuel) 14%, transparent); border-radius: 8px; padding: 6px 9px; }
/* holo flags: a foil sheen over the flag picture. Named foilflag, not holo: the shop's holographic look puts .holo on the whole page */
.foilflag { position: relative; display: block; line-height: 0; border-radius: 4px; }
.fd-flags .foilflag { width: fit-content; margin-inline: auto; border-radius: 6px; }
.foilflag::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; mix-blend-mode: soft-light; opacity: .55;
  background: linear-gradient(115deg, transparent 25%, rgba(255,120,210,.6) 38%, rgba(120,220,255,.6) 50%, rgba(255,240,140,.6) 62%, transparent 75%);
  background-size: 260% 100%; background-position: 50% 0; }
.fd-flags .foilflag::after, .flagtile:hover .foilflag::after, .flagtile:focus-visible .foilflag::after { animation: foilsweep 2.4s ease-in-out 1; }
@keyframes foilsweep { from { background-position: 130% 0; } to { background-position: -130% 0; } }
.holotag { position: absolute; top: 3px; right: 3px; z-index: 2; font: 800 9px/1 var(--display); letter-spacing: .08em; padding: 2px 4px; border-radius: 3px; color: #1d1606;
  background: linear-gradient(90deg, #FF8AD8, #8AE8FF, #FFF08A); }
.sharebtn { margin-left: auto; }
.chalrank { font: 700 13px/1.3 var(--body); }
@media (prefers-reduced-motion: reduce) { .foilflag::after { animation: none; background-position: 50% 0; } .gauge .fill.refilled { animation: none; } }
.deck { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.decktabs { display: flex; gap: 2px; padding: 5px 6px 0; border-bottom: 1px solid var(--line); flex: none; }
.decktabs button { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); font: 700 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 9px 6px; border-radius: 7px 7px 0 0; cursor: pointer; white-space: nowrap; }
.decktabs button:hover { color: var(--ink); background: var(--panel-2); }
.decktabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.decktabs .count { margin-left: 0; background: var(--fuel); color: #1d1606; }
.deckbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px; }
.deckbody .log, .deckbody .postcard, .deckbody .wanted { background: none; border: 0; border-radius: 0; padding: 0; }
.deckbody .wanted .wantedhead .label { display: none; } /* the tab already says Wanted */
.deckbody .log ol { margin-top: 0; }
.deckbody .log li:last-child, .deckbody .rescue li:last-child { padding-bottom: 0; }
.tripdetail { display: grid; gap: 12px; }
.tripdetail .passed { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; }
.tripdetail .passed li { background: var(--panel-2); border-radius: 5px; padding: 3px 7px; font-size: 13px; }
.tripdetail .passed li small { color: var(--muted); }
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 10px; padding: 12px 14px; box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px var(--sign-edge); }
.sign .from { font: 600 13px/1.2 var(--body); opacity: .9; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.sign .to { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; margin-top: 6px; }
.sign .arrow { width: 34px; height: 34px; display: grid; place-items: center; transition: transform .4s ease; }
.sign .dest { font: 800 34px/0.95 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.sign .dest small { display: block; font: 600 13px/1.3 var(--body); text-transform: none; letter-spacing: 0; opacity: .9; margin-top: 3px; }
.sign .km { font: 700 28px/1 var(--display); text-align: right; white-space: nowrap; }
.sign .km small { display: block; font: 500 11px/1.2 var(--body); opacity: .8; }
.fl { display: inline-block; height: 1em; width: 1.5em; object-fit: cover; vertical-align: -0.12em; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.18); margin-right: .3em; }
.fl.emoji { box-shadow: none; width: auto; height: auto; }

.dash, .entry, .log, .postcard, .finish { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.dash { display: grid; gap: 10px; }
.gaugehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.label { font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.gaugeval { font: 500 13px/1 var(--mono); font-variant-numeric: tabular-nums; }
.gauge { position: relative; height: 16px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.gauge .fill { position: absolute; inset: 0 auto 0 0; background: var(--fuel); transition: width .5s ease, background .3s; }
.gauge.low .fill { background: var(--danger); }
.gauge .ticks { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; }
.gauge .ticks span { border-right: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
.gauge .ticks span:last-child { border-right: 0; }
.gaugescale { display: flex; justify-content: space-between; font: 600 11px/1 var(--display); color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat b { display: block; font: 700 24px/1.05 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tickets { display: flex; gap: 3px; margin-top: 3px; min-height: 22px; align-items: center; flex-wrap: wrap; }
.ticket { width: 22px; height: 16px; border-radius: 3px; background: var(--ferry); position: relative; }
.ticket::after { content: ""; position: absolute; left: 50%; top: 2px; bottom: 2px; border-left: 1px dashed rgba(255,255,255,.7); }
.ticket.used { background: transparent; border: 1px dashed var(--line); }
.ticket.used::after { display: none; }

.entry { display: grid; gap: 8px; }
.entryrow { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.entry input[type="text"], .bigfield { width: 100%; min-width: 0; border: 2px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; font-size: 17px; font-weight: 500; }
.entry input[type="text"]:focus, .bigfield:focus { border-color: var(--accent); outline: none; }
.hint { font-size: 13px; color: var(--muted); }
.msg { font-size: 14px; min-height: 20px; }
.msg.bad { color: var(--danger); }
.msg.good { color: var(--good); }
.sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.45); list-style: none; margin: 0; padding: 4px; z-index: 5; max-height: 300px; overflow-y: auto; }
.sugg li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.sugg li[aria-selected="true"] { background: var(--panel-2); }
.sugg li small { color: var(--muted); display: block; font-size: 12px; }
.sugg .rng { font: 500 11px/1.3 var(--mono); text-align: right; white-space: nowrap; color: var(--muted); }
.sugg .rng.in { color: var(--good); }
.sugg .rng.maybe { color: var(--fuel); } /* reachable only if a road goes round, or a ticket turns up */
.msgact { margin-left: 8px; vertical-align: 1px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.scouts { display: grid; gap: 6px; }
.scout { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 8px; padding: 7px 10px; font-size: 14px; }
.scout .pin { width: 22px; height: 22px; border-radius: 50%; background: var(--ferry); color: #fff; display: grid; place-items: center; font: 700 13px/1 var(--display); }
.scout .masked { font: 500 14px/1.2 var(--mono); letter-spacing: .08em; }
.scout small { display: block; color: var(--muted); font-size: 12px; }
.scout .scoutbtns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.postcard { display: grid; gap: 10px; }
.postcard h3 { margin: 0; font: 800 26px/1 var(--display); text-transform: uppercase; }
.postcard .sub { color: var(--muted); font-size: 13px; }
.flagrow { display: flex; gap: 10px; flex-wrap: wrap; }
.flagcard { display: grid; gap: 4px; width: 92px; align-content: start; }
.flagcard img { width: 92px; height: 62px; object-fit: contain; background: var(--panel-2); border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.flagcard span { font-size: 12px; line-height: 1.2; overflow-wrap: anywhere; }
.flagcard em { font: 700 10px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.flagcard em.newflag { color: var(--ferry); }
.chipline { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
.chip { background: var(--panel-2); border-radius: 999px; padding: 3px 9px; }
.chip.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); font-weight: 600; }
.chip.warn { background: color-mix(in srgb, var(--fuel) 24%, transparent); }

.log ol, .rescue ol { list-style: none; margin: 10px 0 0; padding: 0; }
.log li, .rescue li { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; position: relative; padding-bottom: 12px; }
.log li::before, .rescue li::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: -2px; border-left: 2px solid var(--route); }
.rescue li::before { border-left: 2px dashed #12A150; }
.log li.ferry::before, .rescue li.ferry::before { border-left: 2px dashed var(--ferry); }
.log li:last-child::before, .rescue li:last-child::before { display: none; }
.log .dot, .rescue .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 3px solid var(--route); margin-top: 2px; }
.rescue .dot { border-color: #12A150; font: 700 9px/10px var(--display); text-align: center; }
.log li.start .dot { background: var(--route); }
.log .where, .rescue .where { font-weight: 600; line-height: 1.25; }
.log .where a { text-decoration-color: var(--line); }
.log .meta, .rescue .meta { font-size: 12.5px; color: var(--muted); }
.log .pts { font: 700 20px/1 var(--display); color: var(--good); text-align: right; white-space: nowrap; }
.log .pts small { display: block; font: 500 10px/1.3 var(--mono); color: var(--muted); }
.tier { display: inline-block; font: 700 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px 2px; border-radius: 3px; background: var(--panel-2); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.tier.village, .tier.town { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.newstamp { font: 700 10px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ferry); margin-left: 4px; }
.finish { border: 2px solid var(--accent); display: grid; gap: 10px; }
.finish h2 { margin: 0; font: 800 30px/1 var(--display); text-transform: uppercase; }
.finish p { margin: 0; }
.finish ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px; }
.finish ul li { background: var(--panel-2); border-radius: 5px; padding: 3px 7px; font-size: 13px; }
.finish ul li small { color: var(--muted); }

dialog { border: 0; padding: 0; border-radius: 14px; background: var(--panel); color: var(--ink); width: min(680px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.55); }
dialog.full { width: min(1320px, calc(100vw - 32px)); height: calc(100dvh - 40px); max-height: none; overflow: hidden; }
dialog::backdrop { background: rgba(6, 14, 10, .55); }
.dlg header { display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); align-items: start; }
.dlg h2 { margin: 0; font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.dlg header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.dlg section { padding: 14px 20px; border-bottom: 1px solid var(--line); }
.dlg section:last-of-type { border-bottom: 0; }
.dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; flex-wrap: wrap; }
.x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; flex: none; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.choice { border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 11px; cursor: pointer; font-weight: 600; font-size: 14px; text-align: left; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.choice:disabled { opacity: .45; cursor: not-allowed; }
.choice small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.vehicles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.vehicles .choice b { display: block; font: 700 20px/1.1 var(--display); text-transform: uppercase; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.tiers { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
.tiers th, .tiers td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
.tiers td:nth-child(n+3), .tiers th:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
.switchrow { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding-block: 6px; }
.switchrow small { display: block; color: var(--muted); font-size: 13px; }
.toggle { position: relative; width: 46px; height: 26px; flex: none; }
.toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle input:checked + span { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + span::after { transform: translateX(20px); background: #fff; }
.toggle input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 13px; }
.tag button { border: 0; background: transparent; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
.field { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); min-width: 0; }

.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 8px; align-content: start; background: var(--panel-2); }
.item .swatch { height: 70px; border-radius: 6px; display: grid; place-items: center; font-size: 34px; overflow: hidden; border: 1px solid var(--line); }
.item b { font: 700 18px/1.1 var(--display); text-transform: uppercase; display: block; }
.item small { color: var(--muted); font-size: 12.5px; }
.item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.price { display: inline-flex; gap: 5px; align-items: center; font: 700 16px/1 var(--display); }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100% - 70px); min-height: 0; }
.split .mapwrap { border-radius: 0; border: 0; border-right: 1px solid var(--line); min-height: 0; }
.side { overflow-y: auto; padding: 14px 18px; display: grid; gap: 14px; align-content: start; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); }
.masterylegend { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
.masterylegend span { height: 12px; border-radius: 2px; }
.masterylabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.cstat h3 { margin: 0; font: 800 28px/1 var(--display); text-transform: uppercase; }
.levelbar { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; }
.levelbar div { height: 100%; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding-block: 3px; }
.list li > span:last-child { color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: right; }
.ach { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; background: var(--panel-2); }
.ach .ico { font-size: 26px; text-align: center; filter: grayscale(1); opacity: .45; }
.ach.done .ico { filter: none; opacity: 1; }
.ach small { display: block; color: var(--muted); font-size: 12.5px; }
.quizbar { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.45); text-align: center; z-index: 2; max-width: calc(100% - 24px); }
.quizbar b { display: block; font: 800 28px/1.05 var(--display); text-transform: uppercase; }
.quizbar small { color: var(--muted); font-size: 12.5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; box-shadow: 0 16px 40px -18px rgba(0,0,0,.6); max-width: calc(100vw - 32px); }

@media (max-width: 1060px) {
  .stage { grid-template-columns: 1fr; }
  .mapwrap { min-height: 0; height: 46svh; }
  .split { grid-template-columns: 1fr; grid-template-rows: 46% 54%; }
  .split .mapwrap { height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (min-width: 1061px) {
  /* the game is a cockpit, not a document: it fills the window and the deck scrolls, not the page */
  .app { height: 100dvh; min-height: 620px; }
  .mapwrap { min-height: 260px; }
  .deck { min-height: 132px; } /* a race panel on top of a full console must not squeeze it to nothing */
}
@media (max-width: 1060px) {
  .deck { flex: none; }
  .deckbody { overflow-y: visible; }
}
/* phones: the place box comes straight after the road sign, so the game can be played without scrolling past the
   gauges; the map gives up a little height; keyboard hints mean nothing on a touch screen */
@media (max-width: 760px) {
  .mapwrap { height: 38svh; }
  .console > #sign { order: 0; }
  .console > #play { order: 1; }
  .console > #dash { order: 2; }
  .console > #deck { order: 3; }
}
@media (pointer: coarse) { kbd { display: none; } }
@media (max-width: 480px) {
  .wordmark { font-size: 24px; }
  .sign .dest { font-size: 28px; }
  .vehicles { grid-template-columns: 1fr 1fr; }
  .routepick { grid-template-columns: 1fr; }
  .brandmode { width: 48px; }
  .stat b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
/* ---------- V3 features in the V2 look: count badge, rail, train news, blind spots, flag collection ---------- */
.btn .count { display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: var(--route); color: #fff; font: 700 11px/1.4 var(--mono); vertical-align: 1px; text-align: center; }
.btn.dark { background: var(--ink); color: var(--page); border-color: var(--ink); }
.legend i.t { border-top: 3px dashed #2B2B2B; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 5px 2px; border-radius: 4px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--panel); color: var(--ink); }
dialog.news.stacked { translate: 0 -18px; }
.news-hero.rail { background: linear-gradient(180deg, #27305C 0%, #7A4E7E 42%, #E98A5B 74%, #F7C98C 100%); }
.news-hero .train { animation: railrun 7.5s cubic-bezier(.35,.05,.6,.95) infinite; }
.news-hero .train .bob { animation: bob .32s ease-in-out infinite alternate; }
.news-hero .train .speed { animation: speedlines 7.5s linear infinite; }
.news-hero .birds { animation: drift 30s linear infinite; animation-delay: -12s; }
@keyframes railrun { 0% { transform: translateX(-10px); } 100% { transform: translateX(1060px); } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
.news-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.news-facts div { background: var(--panel-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; color: var(--muted); }
.news-facts b { display: block; font: 800 22px/1.1 var(--display); color: var(--ink); }

.bs-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr) auto; height: calc(100% - 70px); min-height: 0; }
.bs-grid .mapwrap { border-radius: 0; border: 0; border-right: 1px solid var(--line); min-height: 0; }
.bs-pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--fuel); box-shadow: 0 0 0 3px var(--sign); pointer-events: none; z-index: 2; }
.bs-pin::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--fuel); animation: ping 1.6s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }
.bs-side { overflow-y: auto; padding: 14px 18px; display: grid; gap: 12px; align-content: start; }
.bs-filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { border: 1.5px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.card { perspective: 1400px; }
.card-inner { display: grid; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-inner.in-next { animation: cardin-next .24s ease-out; }
.card-inner.in-prev { animation: cardin-prev .24s ease-out; }
@keyframes cardin-next { from { translate: 28px 0; opacity: .2; } }
@keyframes cardin-prev { from { translate: -28px 0; opacity: .2; } }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; padding: 14px; display: grid; gap: 12px; align-content: start; min-height: 330px; }
.face.front { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px var(--sign-edge); }
.face.back { background: var(--panel); border: 2px solid var(--sign); transform: rotateY(180deg); }
.face .cardtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 12px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.face.front .cardtop { opacity: .85; }
.face.back .cardtop { color: var(--muted); }
.face .q { font: 800 32px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.face .masked { font: 500 22px/1.1 var(--mono); letter-spacing: .12em; overflow-wrap: anywhere; }
.face .answer { font: 800 38px/.95 var(--display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; margin: 0; }
.face .flagset { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.face .flagset figure { margin: 0; display: grid; gap: 5px; }
.face .flagset img, .face .flagset .noflag { width: 100%; aspect-ratio: 3 / 2; object-fit: contain; border-radius: 4px; background: rgba(255,255,255,.12); }
.face.back .flagset img, .face.back .flagset .noflag { background: var(--panel-2); box-shadow: 0 0 0 1px var(--line); }
.face .flagset .noflag { display: grid; place-items: center; font-size: 11.5px; opacity: .8; }
.face .flagset figcaption { font-size: 12px; line-height: 1.2; overflow-wrap: anywhere; }
.face.front .flagset figcaption { opacity: .9; }
.face.back .flagset figcaption { color: var(--muted); }
